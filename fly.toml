# fly.toml app configuration file generated for phoenix on 2026-04-27
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'phoenix-app'
primary_region = 'mia'  # Miami - puedes cambiar a tu región preferida

[build]

[env]
  PHOENIX_WORKING_DIR = '/mnt/data'

[http_service]
  internal_port = 6006
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

# Additional services for GRPC and Prometheus
[[services]]
  protocol = 'tcp'
  internal_port = 4317

  [[services.ports]]
    port = 4317

[[services]]
  protocol = 'tcp'
  internal_port = 9090

  [[services.ports]]
    port = 9090

# Volume for persistent data
[mounts]
  source = 'phoenix_data'
  destination = '/mnt/data'
  initial_size = '1gb'
